<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Battler</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <div id="menu">
        <div class="selection-layout">
            <aside class="character-portrait portrait-p1" aria-live="polite">
                <div class="portrait-label">Jogador 1</div>
                <div id="p1-portrait-bubble" class="portrait-bubble portrait-bubble-empty" aria-hidden="true">?</div>
                <strong id="p1-portrait-name">Escolha</strong>
                <span class="portrait-special">Especial: <strong id="p1-portrait-special">-</strong></span>
            </aside>

            <main class="selection-panel">
                <h1>Bubble Battler</h1>
                <p class="selection-kicker">Escolha sua bubble</p>
        
        <div class="mode-selector" style="margin-bottom: 15px;">
            <label>Modo de Jogo: </label>
            <select id="game-mode" style="padding: 5px; font-weight: bold;">
                <option value="pvp">2 Jogadores (Local)</option>
                <option value="ai">Contra a Máquina (IA)</option>
                <option value="ai-ai">IA x IA</option>
            </select>
        </div>

        <div id="ai-difficulty-container" class="hidden" style="margin-bottom: 15px;">
            <label>Dificuldade da IA: </label>
            <select id="ai-level" style="padding: 5px; font-weight: bold;">
                <option value="easy">Fácil</option>
                <option value="medium">Médio</option>
                <option value="hard">Difícil</option>
            </select>
        </div>

        <div class="selector-container">
            <div class="player-column">
                <h3 id="p1-title">Jogador 1 (WASD | Esp. 'E')</h3>
                <div class="options">
                    <button class="character-btn" data-player="1" data-character="naruto" style="background:#f07818"><span class="character-preview character-preview-naruto" aria-hidden="true"></span><span class="character-mark mark-naruto" aria-hidden="true">✦</span>Naruto</button>
                    <button class="character-btn" data-player="1" data-character="sasuke" style="background:#3949ab"><span class="character-preview character-preview-sasuke" aria-hidden="true"></span><span class="character-mark mark-sasuke" aria-hidden="true">◈</span>Sasuke</button>
                    <button class="character-btn" data-player="1" data-character="sakura" style="background:#d9578b"><span class="character-preview character-preview-sakura" aria-hidden="true"></span><span class="character-mark mark-sakura" aria-hidden="true">✿</span>Sakura</button>
                    <button class="character-btn" data-player="1" data-character="shikamaru"><span class="character-preview character-preview-shikamaru" aria-hidden="true"></span><span class="character-mark mark-shikamaru" aria-hidden="true">☾</span>Shikamaru</button>
                    <button class="character-btn" data-player="1" data-character="kiba"><span class="character-preview character-preview-kiba" aria-hidden="true"></span><span class="character-mark mark-kiba" aria-hidden="true">◎</span>Kiba</button>
                    <button class="character-btn" data-player="1" data-character="hinata"><span class="character-preview character-preview-hinata" aria-hidden="true"></span><span class="character-mark mark-hinata" aria-hidden="true">◉</span>Hinata</button>
                    <button class="character-btn" data-player="1" data-character="shino"><span class="character-preview character-preview-shino" aria-hidden="true"></span><span class="character-mark mark-shino" aria-hidden="true">✧</span>Shino</button>
                    <button class="character-btn" data-player="1" data-character="ino"><span class="character-preview character-preview-ino" aria-hidden="true"></span><span class="character-mark mark-ino" aria-hidden="true">✿</span>Ino</button>
                    <button class="character-btn" data-player="1" data-character="choji"><span class="character-preview character-preview-choji" aria-hidden="true"></span><span class="character-mark mark-choji" aria-hidden="true">●</span>Choji</button>
                </div>
            </div>
            <div class="player-column" id="p2-column">
                <h3 id="p2-title">Jogador 2 (Setas | Esp. 'Shift')</h3>
                <div class="options">
                    <button class="character-btn" data-player="2" data-character="naruto" style="background:#f07818"><span class="character-preview character-preview-naruto" aria-hidden="true"></span><span class="character-mark mark-naruto" aria-hidden="true">✦</span>Naruto</button>
                    <button class="character-btn" data-player="2" data-character="sasuke" style="background:#3949ab"><span class="character-preview character-preview-sasuke" aria-hidden="true"></span><span class="character-mark mark-sasuke" aria-hidden="true">◈</span>Sasuke</button>
                    <button class="character-btn" data-player="2" data-character="sakura" style="background:#d9578b"><span class="character-preview character-preview-sakura" aria-hidden="true"></span><span class="character-mark mark-sakura" aria-hidden="true">✿</span>Sakura</button>
                    <button class="character-btn" data-player="2" data-character="shikamaru"><span class="character-preview character-preview-shikamaru" aria-hidden="true"></span><span class="character-mark mark-shikamaru" aria-hidden="true">☾</span>Shikamaru</button>
                    <button class="character-btn" data-player="2" data-character="kiba"><span class="character-preview character-preview-kiba" aria-hidden="true"></span><span class="character-mark mark-kiba" aria-hidden="true">◎</span>Kiba</button>
                    <button class="character-btn" data-player="2" data-character="hinata"><span class="character-preview character-preview-hinata" aria-hidden="true"></span><span class="character-mark mark-hinata" aria-hidden="true">◉</span>Hinata</button>
                    <button class="character-btn" data-player="2" data-character="shino"><span class="character-preview character-preview-shino" aria-hidden="true"></span><span class="character-mark mark-shino" aria-hidden="true">✧</span>Shino</button>
                    <button class="character-btn" data-player="2" data-character="ino"><span class="character-preview character-preview-ino" aria-hidden="true"></span><span class="character-mark mark-ino" aria-hidden="true">✿</span>Ino</button>
                    <button class="character-btn" data-player="2" data-character="choji"><span class="character-preview character-preview-choji" aria-hidden="true"></span><span class="character-mark mark-choji" aria-hidden="true">●</span>Choji</button>
                </div>
            </div>
        </div>
                <button id="start-btn" disabled>Iniciar Batalha</button>
            </main>

            <aside class="character-portrait portrait-p2" aria-live="polite">
                <div class="portrait-label">Jogador 2</div>
                <div id="p2-portrait-bubble" class="portrait-bubble portrait-bubble-empty" aria-hidden="true">?</div>
                <strong id="p2-portrait-name">Escolha</strong>
                <span class="portrait-special">Especial: <strong id="p2-portrait-special">-</strong></span>
            </aside>
        </div>
    </div>

    <div id="game-container" class="hidden">
        <div id="hud">
            <div id="p1-hud">P1 HP: <span id="p1-hp">300</span> | Joias: <span id="p1-gems">0</span>/3 <span id="p1-spec" style="color:#f1c40f; font-weight: bold;"></span></div>
            <div style="display: flex; gap: 10px;">
                <button id="pause-btn" style="padding: 5px 15px; font-weight: bold; cursor: pointer;">Pausar</button>
                <button id="in-game-restart-btn" style="padding: 5px 15px; font-weight: bold; cursor: pointer; background: #ff4757; color: white; border: none; border-radius: 4px;">Reiniciar</button>
                <button id="exit-btn" style="padding: 5px 15px; font-weight: bold; cursor: pointer;">Sair</button>
            </div>
            <div id="p2-hud">P2 HP: <span id="p2-hp">300</span> | Joias: <span id="p2-gems">0</span>/3 <span id="p2-spec" style="color:#f1c40f; font-weight: bold;"></span></div>
        </div>
        <div style="position: relative; display: inline-block;">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            <div id="pause-screen" class="hidden" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; font-size: 30px; font-weight: bold; color: white;">
                JOGO PAUSADO
            </div>
        </div>
        <div id="winner-text" style="font-size: 22px; font-weight: bold; margin-top: 10px;"></div>
        <button id="restart-btn" class="hidden" style="margin-top: 15px; padding: 10px 20px; background: #ff4757; border: none; color: white; font-weight: bold; border-radius: 5px; cursor: pointer;">Voltar ao Menu</button>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
